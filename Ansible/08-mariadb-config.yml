---
- hosts: db
  become: true

  tasks:
    - name: Ensure MariaDB-server is installed
      ansible.builtin.package:
        name: mariadb-server
        state: present

    - name: Ensure MariaDB is enabled and running on boot
      ansible.builtin.service:
        name: mariadb
        enabled: true
        state: started

    - name: Install Python3 MySQL library (PyMySQL)
      ansible.builtin.package:
        name: python3-PyMySQL
        state: present

    - name: Create MariaDB user 'webappuser'
      community.mysql.mysql_user:
        name: webappuser
        password: secretpassword
        host: localhost
        priv: "*.*:ALL"
        state: present
        login_user: root
        login_unix_socket: /var/lib/mysql/mysql.sock

    - name: Create database 'webapp'
      community.mysql.mysql_db:
        name: webapp
        login_user: webappuser
        login_password: secretpassword
        login_unix_socket: /var/lib/mysql/mysql.sock
        state: present
