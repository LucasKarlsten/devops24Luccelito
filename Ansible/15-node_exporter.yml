---
- name: Install and run Prometheus Node Exporter 
  hosts: all
  become: true
  gather_facts: yes

  vars:
    ne_version: "1.8.1"

  tasks:
    - name: Determine Go arch from system arch
      ansible.builtin.set_fact:
        ne_arch: >-
          {{ {'x86_64':'amd64','aarch64':'arm64','armv7l':'armv7'}[ansible_facts.architecture]
             | default('amd64') }}

    - name: Create node_exporter user (nologin)
      ansible.builtin.user:
        name: node_exporter
        system: true
        shell: /sbin/nologin
        home: /var/lib/node_exporter
        create_home: true

    - name: Create install dir
      ansible.builtin.file:
        path: "/opt/node_exporter-{{ ne_version }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download node_exporter tarball
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ ne_version }}/node_exporter-{{ ne_version }}.linux-{{ ne_arch }}.tar.gz"
        dest: "/opt/node_exporter-{{ ne_version }}/node_exporter.tar.gz"
        mode: "0644"

    - name: Unpack tarball
      ansible.builtin.unarchive:
        src: "/opt/node_exporter-{{ ne_version }}/node_exporter.tar.gz"
        dest: "/opt/node_exporter-{{ ne_version }}"
        remote_src: true
        creates: "/opt/node_exporter-{{ ne_version }}/node_exporter-{{ ne_version }}.linux-{{ ne_arch }}/node_exporter"

    - name: Symlink binary to /usr/local/bin/node_exporter
      ansible.builtin.file:
        src: "/opt/node_exporter-{{ ne_version }}/node_exporter-{{ ne_version }}.linux-{{ ne_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        state: link
        force: true
      notify: restart node_exporter

    - name: Create systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=0.0.0.0:9100
          Restart=on-failure
          RestartSec=5s
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
      notify: daemon-reload

    - name: Enable and start service
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

    # --- Firewall (only if using firewalld) ---
    - name: Ensure firewalld and python bindings are present
      ansible.builtin.package:
        name: [firewalld, python3-firewall]
        state: present

    - name: Ensure firewalld is running
      ansible.builtin.service:
        name: firewalld
        enabled: true
        state: started

    - name: Open Node Exporter port 9100/tcp
      ansible.posix.firewalld:
        port: 9100/tcp
        state: enabled
        permanent: true
        immediate: true

  handlers:
    - name: daemon-reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted

