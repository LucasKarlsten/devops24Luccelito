---
- name: Configure nginx vhost via template (listen only on external IPv4)
  hosts: web
  become: true
  gather_facts: yes   # required so we can read the default IPv4 address

  vars:
    listen_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

  tasks:
    - name: Ensure nginx is installed
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Ensure document root exists 
      ansible.builtin.file:
        path: /var/www/example.internal/html
        state: directory
        owner: root
        group: root
        mode: "0755"
        setype: httpd_sys_content_t
        recurse: true

    - name: Deploy vhost config from template
      ansible.builtin.template:
        src: templates/example.internal.conf.j2
        dest: /etc/nginx/conf.d/example.internal.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

  handlers:
    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
        daemon_reload: true

