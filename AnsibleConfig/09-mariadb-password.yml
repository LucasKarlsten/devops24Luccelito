---
- hosts: db
  become: true
  vars:
    vault_passwd: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      38623964346565313761353539393437323838653162323466333731613266323563366631363766
      3233373137663265303737653363666164336231386462660a366437333561326433333564343834
      35303436303464626665613937306232663639343234306663643539316434643363336163616130
      3834616239363335340a626537376139383538313830323861656562323835626134323839356334
      3538

  tasks:
    - name: Ensure MariaDB server is installed
      ansible.builtin.package:
        name: mariadb-server
        state: present

    - name: Ensure MariaDB is enabled and running
      ansible.builtin.service:
        name: mariadb
        enabled: true
        state: started

    - name: Install Python3 MySQL library (PyMySQL)
      ansible.builtin.package:
        name: python3-PyMySQL
        state: present

    - name: Create MariaDB user 'webappuser'
      community.mysql.mysql_user:
        name: webappuser
        password: "{{vault_passwd}}"
        host: localhost
        priv: "*.*:ALL"
        state: present
        login_user: root
        login_unix_socket: /var/lib/mysql/mysql.sock

    - name: Create database 'webapp'
      community.mysql.mysql_db:
        name: webapp
        state: present
        login_user: webappuser
        login_password: "{{vault_passwd}}"
        login_unix_socket: /var/lib/mysql/mysql.sock

