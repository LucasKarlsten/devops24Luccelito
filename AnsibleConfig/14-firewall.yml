---

- name: Configure firewall on web servers
  hosts: web
  become: true

  vars:
    firewall_packages:
      - firewalld
      - python3-firewall

  tasks:
    - name: Ensure firewalld packages are installed
      ansible.builtin.package:
        name: "{{ firewall_packages }}"
        state: present

    - name: Ensure firewalld is enabled and running
      ansible.builtin.service:
        name: firewalld
        enabled: true
        state: started

    - name: Allow HTTP/HTTPS services
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: true     # persist to disk
        immediate: true     # apply to runtime now
      loop:
        - http
        - https

- name: Configure firewall on DB servers
  hosts: db
  become: true

  vars:
    firewall_packages:
      - firewalld
      - python3-firewall

  tasks:
    - name: Ensure firewalld packages are installed
      ansible.builtin.package:
        name: "{{ firewall_packages }}"
        state: present

    - name: Ensure firewalld is enabled and running
      ansible.builtin.service:
        name: firewalld
        enabled: true
        state: started

    - name: Allow MySQL service
      ansible.posix.firewalld:
        service: mysql
        state: enabled
        permanent: true
        immediate: true

