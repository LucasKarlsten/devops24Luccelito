---
- name: Deploy nginx https.conf to web hosts
  hosts: web
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.package:
        name: nginx
        state: present

    - name: Ensure nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Copy https.conf into place
      ansible.builtin.copy:
        src: /home/luccelito/AutomatiseringMCM/devops24Luccelito/examinations/05/files/https.conf 
        dest: /etc/nginx/conf.d/https.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart nginx

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
